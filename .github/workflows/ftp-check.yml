# Diagnose: listet nur die Ordner auf dem Hostinger-FTP auf (ändert nichts).
# Starten: GitHub → Actions → "FTP-Ordner anzeigen" → Run workflow.
name: FTP-Ordner anzeigen

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Ordner auflisten
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for h in srv1812.hstgr.io 46.202.158.178; do
            for d in "" "public_html/" "domains/mercan-gemuese-doener.de/public_html/"; do
              echo "=== $h /$d :: $(curl -s -m 30 --list-only --user "$U:$P" "ftp://$h/$d" | sort | tr '\n' ' ')"
            done
          done
